name: Build release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o dist/chaturbate-dvr-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o dist/chaturbate-dvr-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o dist/chaturbate-dvr-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=amd64 go build -o dist/chaturbate-dvr-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o dist/chaturbate-dvr-darwin-arm64 .

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
